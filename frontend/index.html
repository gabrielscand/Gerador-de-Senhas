<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Senhas Seguras</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🔐 Gerador de Senhas Seguras</h1>

    <div class="form-group">
      <label for="length">Tamanho da senha:</label>
      <input type="number" id="length" min="4" max="50" value="12">
    </div>

    <div class="options">
      <label><input type="checkbox" id="upper" checked> Letras maiúsculas</label>
      <label><input type="checkbox" id="lower" checked> Letras minúsculas</label>
      <label><input type="checkbox" id="digits" checked> Números</label>
      <label><input type="checkbox" id="symbols" checked> Símbolos</label>
    </div>

    <button id="generateBtn">🔑 Gerar Senha</button>

    <div class="result">
      <h2>Sua senha:</h2>
      <p id="password">Clique no botão acima</p>
      <button id="copyBtn">📋 Copiar</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
